name: kamailio-media-control-lab
services:
  rtpengine:
    image: rtpengine-sbc-lab:dev
    build: .
    network_mode: none
    user: nobody
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
