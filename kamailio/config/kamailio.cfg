#!KAMAILIO
# Controlled signaling lab. Addresses rendered from isolated Docker DNS.
debug=2
log_stderror=yes
log_prefix="lab cid=$ci method=$rm "
fork=yes
children=2
listen=udp:@EXTERNAL_IP@:5060
listen=tcp:@EXTERNAL_IP@:5060
listen=udp:@INTERNAL_IP@:5080
listen=tcp:@INTERNAL_IP@:5080
alias=sbc-external
alias=sbc-internal
tcp_children=2
tcp_accept_no_cl=yes
#!ifdef WITH_TLS
enable_tls=yes
listen=tls:@EXTERNAL_IP@:5061
listen=tls:@EXTERNAL_IP@:8443
#!endif
loadmodule "pv.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "dispatcher.so"
modparam("dispatcher", "list_file", "/tmp/dispatcher.list")
modparam("dispatcher", "ds_ping_interval", 0)
modparam("rr", "enable_full_lr", 1)
#!ifdef WITH_TLS
loadmodule "tls.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
modparam("tls", "config", "/opt/lab/config/tls.cfg")
#!endif

request_route {
    force_rport();
    if (!sanity_check("1511", "7")) { exit; }
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops"); exit;
    }
    # Lab identity = isolated test container or configured backend only.
    # No public registrar, authentication database, or public relay.
    if ($si != "@CLIENT_IP@" && $si != "@BACKEND_IP@") {
        sl_send_reply("403", "Forbidden"); exit;
    }
    if (is_method("REGISTER")) {
        sl_send_reply("403", "Registration Disabled"); exit;
    }
    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }
    if (is_method("ACK") && t_check_trans()) { t_relay(); exit; }
    if (!is_method("ACK")) {
        if (t_check_trans()) { exit; }
    }
    if (has_totag()) {
        # Restrict even preloaded Route headers to known lab next hops.
        if (!loose_route()) { sl_send_reply("404", "No Route"); exit; }
        if ($si == "@CLIENT_IP@") {
            $du = "sip:@BACKEND_IP@:5080";
        } else {
            # Reverse dialog routing requires negotiated contact/flow ownership.
            sl_send_reply("403", "Reverse Dialog Not Enabled"); exit;
        }
        route(RELAY); exit;
    }
    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply("200", "OK"); exit;
    }
    if ($si != "@CLIENT_IP@") {
        sl_send_reply("403", "Backend Origination Disabled"); exit;
    }
    if (!is_method("INVITE|OPTIONS|BYE")) {
        sl_send_reply("405", "Method Not Allowed"); exit;
    }
    # Explicit domain policy; source trust never authorizes arbitrary destinations.
    if ($rd != "lab.invalid") {
        sl_send_reply("403", "Destination Forbidden"); exit;
    }
    if (!ds_select_dst("1", "4")) {
        sl_send_reply("503", "No Backend"); exit;
    }
    if (is_method("INVITE")) { record_route(); }
    route(RELAY);
}
route[RELAY] {
    force_send_socket(udp:@INTERNAL_IP@:5080);
    xlog("L_INFO", "event=relay dst=$du\n");
    if (!t_relay()) { sl_reply_error(); }
    exit;
}
#!ifdef WITH_TLS
event_route[xhttp:request] {
    if ($Rp != 8443 || $hu != "/sip" || $hdr(Origin) != "https://lab.invalid"
            || $si != "@CLIENT_IP@") {
        xhttp_reply("403", "Forbidden", "text/plain", "Forbidden\n"); exit;
    }
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade") {
        if (ws_handle_handshake()) { exit; }
    }
    xhttp_reply("400", "Bad Request", "text/plain", "Bad WebSocket handshake\n");
}
#!endif
