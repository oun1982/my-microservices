[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /run/lab-tls/server.key
certificate = /run/lab-tls/server.crt
ca_list = /run/lab-tls/ca.crt
[client:default]
method = TLSv1.2+
verify_certificate = yes
require_certificate = yes
ca_list = /run/lab-tls/ca.crt
