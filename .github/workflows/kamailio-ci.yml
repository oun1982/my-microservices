name: Kamailio CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "kamailio/**"
      - ".github/workflows/kamailio-ci.yml"

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Docker Build and Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Kamailio image
        uses: docker/build-push-action@v7
        with:
          context: ./kamailio
          file: ./kamailio/Dockerfile
          push: false
          load: true
          tags: kamailio-sbc-lab:ci

      - name: Build RTPengine image
        uses: docker/build-push-action@v7
        with:
          context: ./kamailio/rtpengine
          file: ./kamailio/rtpengine/Dockerfile
          push: false
          load: true
          tags: rtpengine-sbc-lab:ci

      - name: Verify Kamailio version
        run: |
          docker run --rm \
            --entrypoint kamailio \
            kamailio-sbc-lab:ci -V

      - name: Verify Debian version
        run: |
          docker run --rm \
            --entrypoint cat \
            kamailio-sbc-lab:ci /etc/os-release

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f kamailio/compose.yaml \
            config --quiet

          docker compose \
            -f kamailio/compose.yaml \
            -f kamailio/compose.tls.yaml \
            config --quiet

          docker compose \
            -f kamailio/rtpengine/compose.yaml \
            config --quiet

      - name: Prepare runtime image
        run: |
          docker tag kamailio-sbc-lab:ci kamailio-sbc-lab:dev

      - name: Start Kamailio test containers
        run: |
          docker compose -f kamailio/compose.yaml \
            up -d --no-build --pull never

      - name: Check container health
        run: |
          docker compose -f kamailio/compose.yaml \
            ps -a

          docker compose -f kamailio/compose.yaml \
            exec -T kamailio \
            python3 /opt/lab/tests/health.py

      - name: Test SIP UDP and TCP
        run: |
          docker compose -f kamailio/compose.yaml \
            exec -T sip-tester \
            python3 /opt/lab/tests/signaling.py

      - name: Collect logs
        if: always()
        run: |
          docker compose -f kamailio/compose.yaml \
            ps -a

          docker compose -f kamailio/compose.yaml \
            logs --no-color --tail=100

      - name: Stop test containers
        if: always()
        run: |
          docker compose -f kamailio/compose.yaml \
            down --remove-orphans
