name: Kamailio CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "kamailio/**"
      - ".github/workflows/kamailio-ci.yml"

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Docker Build and Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Kamailio image
        uses: docker/build-push-action@v6
        with:
          context: ./kamailio
          file: ./kamailio/Dockerfile
          push: false
          load: true
          tags: kamailio-sbc-lab:ci

      - name: Build RTPengine image
        uses: docker/build-push-action@v6
        with:
          context: ./kamailio/rtpengine
          file: ./kamailio/rtpengine/Dockerfile
          push: false
          load: true
          tags: rtpengine-sbc-lab:ci

      - name: Verify Kamailio version
        run: |
          docker run --rm \
            --entrypoint kamailio \
            kamailio-sbc-lab:ci -V

      - name: Verify Debian version
        run: |
          docker run --rm \
            --entrypoint cat \
            kamailio-sbc-lab:ci /etc/os-release

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f kamailio/compose.yaml \
            config --quiet

          docker compose \
            -f kamailio/compose.yaml \
            -f kamailio/compose.tls.yaml \
            config --quiet

          docker compose \
            -f kamailio/rtpengine/compose.yaml \
            config --quiet
